[package]
name = "cpr-pelican-test"
version = "1.0.1"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "0.10.4"
croner = { version = "4.0.3", default-features = false, features = ["chrono"] }
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "c622f085748f812936a7371fcc85d1621fa72ca8", features = ["io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "macros", "process", "rt", "time"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
